<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ojoxux.com</title>
		<link rel="icon" href="/favicon-32-v2.ico" sizes="32x32" />
		<link rel="icon" href="/favicon-16-v2.ico" sizes="16x16" />
		<link rel="manifest" href="/manifest.json" />
		<script type="module" src="/fe/js/main.ts"></script>
	</head>
	<body>
		<div id="boot" class="home" aria-hidden="true">
			<div class="home__container">
				<div class="home__main">
					<div class="profile-column">
						<div class="profile-content">
							<div class="profile">
								<div class="profile__avatar-frame pulse"></div>
							</div>
						</div>
					</div>
					<div class="panel">
						<div class="panel__mobile-divider"><div class="wave"></div></div>
						<div class="panel__vertical-divider"></div>
						<div class="panel__content">
							<div class="skeleton-waka pulse">
								<div class="skeleton-heading">
									<div class="skeleton-box skeleton-waka__label"></div>
									<div class="skeleton-box skeleton-waka__total"></div>
								</div>
								<div class="skeleton-box skeleton-waka__bar"></div>
							</div>
						</div>
					</div>
					<div class="panel">
						<div class="panel__mobile-divider"><div class="wave"></div></div>
						<div class="panel__vertical-divider"></div>
						<div class="panel__vertical-divider panel__vertical-divider--right"></div>
						<div class="panel__content">
							<div class="skeleton-posts pulse">
								<div class="skeleton-box skeleton-posts__label"></div>
								<div class="skeleton-posts__list">
									<div class="skeleton-posts__post">
										<div class="skeleton-box skeleton-posts__image"></div>
										<div class="skeleton-box skeleton-posts__title"></div>
										<div class="skeleton-box skeleton-posts__date"></div>
									</div>
									<div class="skeleton-posts__post">
										<div class="skeleton-box skeleton-posts__image"></div>
										<div class="skeleton-box skeleton-posts__title"></div>
										<div class="skeleton-box skeleton-posts__date"></div>
									</div>
									<div class="skeleton-posts__post">
										<div class="skeleton-box skeleton-posts__image"></div>
										<div class="skeleton-box skeleton-posts__title"></div>
										<div class="skeleton-box skeleton-posts__date"></div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div id="app"></div>
	</body>
</html>
