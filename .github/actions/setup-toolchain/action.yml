name: Setup toolchain
description: Node.js と pnpm をセットアップし、依存関係をインストールする

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 12

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "26"
        cache: "pnpm"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
