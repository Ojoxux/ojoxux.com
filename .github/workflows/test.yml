name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-toolchain

      - name: Generate API types
        run: nix develop --command scripts/gen-types.sh

      # git diff は未追跡ファイルを検出しないので status --porcelain で見る
      - name: Check generated API types are committed
        run: test -z "$(git status --porcelain worker/src/generated)"

      - name: Haskell tests
        run: nix develop --command cabal test ojoxux-api:test:api-test fe:test:fe-core-test

      - name: Worker tests
        run: pnpm test

      - name: Build WASM
        run: nix develop --command scripts/build-wasm.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm exec vite build
