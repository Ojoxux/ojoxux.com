name: Bump Hackage index-state

# Renovate は cabal.project の index-state を進められないので、週1回ここで進める。
# 解決される依存のバージョンが変わったときだけ PR を作る（変わらなければ何もしない）。
on:
  schedule:
    # 月曜 9:00 JST（Renovate と同じ日にまとめる）
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # PR のテストを起動するため（下の gh workflow run）
  actions: write

concurrency:
  group: bump-index-state

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BRANCH: chore/bump-index-state
    steps:
      - uses: actions/checkout@v7
        with:
          ref: staging

      - uses: ./.github/actions/setup-toolchain

      - name: Record current dependency plan
        run: nix develop --command scripts/cabal-plan.sh > "$RUNNER_TEMP/before.txt"

      # 現在時刻だと Hackage の最新インデックスより新しくなり cabal が拒否するので、
      # cabal update が報告するインデックスの時刻を使う
      - name: Advance index-state to the latest Hackage index
        run: |
          latest=$(nix develop --command cabal update | sed -nE 's/^The index-state is set to ([0-9TZ:-]+)\.?$/\1/p')
          test -n "$latest"
          sed -i -E "s/^index-state: hackage\.haskell\.org .*/index-state: hackage.haskell.org $latest/" cabal.project
          echo "LATEST=$latest" >> "$GITHUB_ENV"

      - name: Record new dependency plan
        run: nix develop --command scripts/cabal-plan.sh > "$RUNNER_TEMP/after.txt"

      - name: Compare plans
        id: plan
        run: |
          if diff -u "$RUNNER_TEMP/before.txt" "$RUNNER_TEMP/after.txt" > "$RUNNER_TEMP/plan.diff"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "解決されるバージョンに変化なし"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/plan.diff"
          fi

      - name: Open or update pull request
        if: steps.plan.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add cabal.project
          git commit -m "Hackage の index-state を $LATEST に進める"
          git push --force origin "$BRANCH"

          {
            echo "cabal.project の index-state を $LATEST に進める。"
            echo
            echo "解決されるバージョンの変化:"
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/plan.diff"
            echo '```'
          } > "$RUNNER_TEMP/body.md"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = 0 ]; then
            gh pr create --base staging --head "$BRANCH" \
              --title "Hackage の index-state を進める" \
              --body-file "$RUNNER_TEMP/body.md" \
              --label dependencies
          else
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          fi

          # GITHUB_TOKEN による push では push / pull_request のワークフローが起動しないので、
          # テストは workflow_dispatch で明示的に起動する（結果は PR のチェックに出る）
          gh workflow run test.yml --ref "$BRANCH"
