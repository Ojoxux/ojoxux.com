<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ojoxux.com</title>
		<link rel="icon" href="/favicon-32-v2.ico" sizes="32x32" />
		<link rel="icon" href="/favicon-16-v2.ico" sizes="16x16" />
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}
			html {
				font-size: 100%;
				line-height: 1.5;
				-webkit-text-size-adjust: 100%;
			}
			body {
				margin: 0;
				background: #000;
				font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
					"Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
					"Helvetica Neue", sans-serif;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}
			.root {
				display: flex;
				min-height: 100vh;
				align-items: center;
				justify-content: center;
				padding-inline: 16px;
				background-color: #000;
			}
			.content {
				text-align: center;
			}
			.title {
				margin-top: 0;
				margin-bottom: 32px;
				font-size: 15vw;
				font-weight: 700;
				color: #fff;
				filter: drop-shadow(8px 8px 0 #4b5563);
				user-select: none;
			}
		</style>
	</head>
	<body>
		<div class="root">
			<div class="content">
				<h1 class="title">404</h1>
			</div>
		</div>
	</body>
</html>
